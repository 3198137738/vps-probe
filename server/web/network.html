

<!DOCTYPE html>
<html lang="zh-CN">

    <link rel="apple-touch-startup-image" href="/static/logo.svg" />
    <link rel="shortcut icon" type="image/png" href="/static/logo.svg">
    <link rel="stylesheet" href="https://unpkg.com/semantic-ui@2.4.0/dist/semantic.min.css">
    <link rel="stylesheet" href="https://unpkg.com/font-logos@0.17.0/assets/font-logos.css">
    <link rel="stylesheet" href="https://unpkg.com/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css">
    <link rel="stylesheet" href="https://unpkg.com/flag-icons@7.2.3/css/flag-icons.min.css">
    <link rel="stylesheet" type="text/css" href="/static/semantic-ui-alerts.min.css">
    <link rel="stylesheet" type="text/css" href="/static/theme-default/css/main.css?v20240816">
    <link rel="stylesheet" type="text/css" href="/static/darkmode.css?v20240816">
    <script src="https://unpkg.com/jquery@3.7.1/dist/jquery.min.js"></script>
    <script src="https://unpkg.com/semantic-ui@2.4.0/dist/semantic.min.js"></script>
    <script src="https://unpkg.com/vue@2.6.14/dist/vue.min.js"></script>

        document.documentElement.setAttribute('nz-theme', window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light');
    </script>
</head>

<body>
    


<div id="app">
<div class="ui large top fixed menu nb-menu" style="z-index:9999999;">
    <div class="ui container">
        <a class="item" href="/">
            <img src="/static/logo.svg?v20210804">
        </a>
        <a class='item' href="/"><i class="home icon"></i>首页</a>
        <template v-if="isMobile"> 
            <div class="item ui dropdown" :class="{ simple: !isMobile }">
                <div class="text"><i class="bi bi-gear-wide-connected icon" style="margin-right:3px;"></i>功能<i class="dropdown icon" style="margin-right:0px;"></i></div>
                <div class="menu">
                    <a href="/network" class="item"><i class="bi bi-hdd-network icon"></i>网络</a>
                </div>
            </div>
        </template>
        <template v-else>
            <a href="/network" class="item"><i class="bi bi-hdd-network icon"></i>网络</a>
        </template>
                
            <div class="item ui dropdown" :class="{ simple: !isMobile }">
                <div class="text"><i class="bi bi-incognito icon" style="margin-right:3px;"></i>主题<i class="dropdown icon" style="margin-right:0px;"></i></div>
                <div class="menu"> 
                    <a v-for="(item, index) in adaptedTemplates" :key="index" @click="toggleTemplate(item.key)" class="item">
                        <i :class="item.icon + ' icon'"></i>@#item.name#@
                        <i class="check icon" v-if="preferredTemplate === item.key"></i>
                    </a>
                    <a v-if="defaultTemplate === 'custom'" @click="toggleTemplate('custom')" class="item">
                        <i class="expand icon"></i>Custom
                    </a>
                </div>
            </div>
        
    </div>
</div>

<div class="nb-container">
    <div class="ui container">
        <div class="service-status">
            <table class="ui celled table">
                <button class="ui nezha-primary-btn button"
                        v-for="server in servers"
                        style="margin-top: 3px"
                        @click="redirectNetwork(server.ID)">
                    @#server.Name#@ &nbsp;<i :class="server.Host.CountryCode + ' flag'"></i>
                </button>
            </table>
        </div>
    </div>
    <div class="ui container">
        <div ref="chartDom" style="margin-top: 15px;height: auto;overflow: hidden"></div>
    </div>
</div>


</div>
<div class="ui inverted vertical footer segment">
    <div class="ui center aligned is-size-7 container">
        <b>&copy; <a style="color: white;" href="/"><span data-nz="brand">云监控</span></a></b> | <small>Powered by <a
                href="https://github.com/naiba/nezha" style="color: white;" target="_blank">哪吒监控</a>
            <span data-nz="version"></span></small>
    </div>
</div>


</body>
</html>


<script>
nzBoot(function (initData) {
  nzMonitor(initData.length ? initData[0].ID : 0).then(function (monitorInfo) {
    let MaxTCPPingValue = 1000;
    new Vue({
        el: '#app',
        delimiters: ['@#', '#@'],
        data: {
            page: 'network',
            defaultTemplate: "default",
            templates: {"default": "默认", "server-status": "ServerStatus"},
            servers: initData,
            option: {}
        },
        mixins: [mixinsVue],
        created() {
            this.option = {
                tooltip: {
                    trigger: 'axis',
                    position: function (pt) {
                        return [pt[0], '10%'];
                    },
                    formatter: function(params){
                        let result = params[0].axisValueLabel + "<br />";
                        params.forEach(function(item){
                            result += item.marker + item.seriesName.replace(/\s[\d.-]+ms$/, "") + ": " + item.value[1].toFixed(2) + " ms<br />";
                         })
                        return result;
                    },
                    confine: true,
                    transitionDuration: 0
                },
                title: {
                    left: 'center',
                    text: "",
                    textStyle: {}
                },
                legend: {
                    top: '5%',
                    data: [],
                    textStyle: {
                        fontSize: 14
                    }
                },
                grid: {
                    left: this.isMobile ? '8%' : '3.8%',
                    right: this.isMobile ? '8%' : '3.8%',
                },
                backgroundColor: '',
                dataZoom: [
                    {
                        type: 'slider',
                        start: 0,
                        end: 100
                    }
                ],
                xAxis: {
                    type: 'time',
                    boundaryGap: false
                },
                yAxis: {
                    type: 'value',
                    boundaryGap: false
                },
                series: [],
            }
        },
        mounted() {
            this.renderChart();
            this.parseMonitorInfo(monitorInfo);
            window.addEventListener('resize', this.resizeHandle);
        },
        destroyed () {
            window.removeEventListener('resize', this.resizeHandle)
        },
        methods: {
            getFontLogoClass(str) {
                if (["almalinux",
                        "alpine",
                        "aosc",
                        "apple",
                        "archlinux",
                        "archlabs",
                        "artix",
                        "budgie",
                        "centos",
                        "coreos",
                        "debian",
                        "deepin",
                        "devuan",
                        "docker",
                        "elementary",
                        "fedora",
                        "ferris",
                        "flathub",
                        "freebsd",
                        "gentoo",
                        "gnu-guix",
                        "illumos",
                        "kali-linux",
                        "linuxmint",
                        "mageia",
                        "mandriva",
                        "manjaro",
                        "nixos",
                        "openbsd",
                        "opensuse",
                        "pop-os",
                        "raspberry-pi",
                        "redhat",
                        "rocky-linux",
                        "sabayon",
                        "slackware",
                        "snappy",
                        "solus",
                        "tux",
                        "ubuntu",
                        "void",
                        "zorin"].indexOf(str)
                    > -1) {
                    return str;
                }
                if (['openwrt', 'linux', "immortalwrt"].indexOf(str) > -1) {
                    return 'tux';
                }
                if (str == 'amazon') {
                    return 'redhat';
                }
                if (str == 'arch') {
                    return 'archlinux';
                }
                return '';
            },
            redirectNetwork(id) {
                    this.getMonitorHistory(id)
                    .then(function(monitorInfo) {
                          var vm = app.__vue__;
                          vm.parseMonitorInfo(monitorInfo);
                    })
                    .catch(function(error){
                        window.location.href = "/404";
                    })
                },
            getMonitorHistory(id) {
                  return nzMonitor(id);
            },
            parseMonitorInfo(monitorInfo) {
                let tSeries = [];
                let tLegendData = [];
                var lcolors = ['#5470c6', '#91cc75', '#fac858', '#ee6666', '#73c0de', '#3ba272', '#fc8452', '#9a60b4', '#ea7ccc'];
                for (let i = 0; i < monitorInfo.result.length; i++) {
                    var lcolor = lcolors[i % lcolors.length];
                    var rgbaColorMarker = 'rgba(' + parseInt(lcolor.slice(1, 3), 16) + ',' + parseInt(lcolor.slice(3, 5), 16) + ',' + parseInt(lcolor.slice(5, 7), 16) + ',0.5)';
                    var rgbaColorBar = 'rgba(' + parseInt(lcolor.slice(1, 3), 16) + ',' + parseInt(lcolor.slice(3, 5), 16) + ',' + parseInt(lcolor.slice(5, 7), 16) + ',0.35)';
                    let loss = 0;
                    let data = [];
                    let datal = [];
                    for (let j = 0; j < monitorInfo.result[i].created_at.length; j++) {
                        avgDelay = Math.round(monitorInfo.result[i].avg_delay[j]);
                        if (avgDelay > 0 && avgDelay < MaxTCPPingValue) {
                            data.push([monitorInfo.result[i].created_at[j], avgDelay]);
                        }
                        else {
                            loss += 1;
                            datal.push({
                                xAxis: monitorInfo.result[i].created_at[j],
                                label: { show: false },
                                emphasis: { disabled: true },
                                lineStyle: {
                                    type: "solid",
                                    color: rgbaColorBar
                                }
                            });
                        }
                    }
                    lossRate = ((loss / monitorInfo.result[i].created_at.length) * 100).toFixed(1);
                    if (lossRate > 99) {
                        datal = [];
                    }
                    legendName = monitorInfo.result[i].monitor_name +" "+ nzAvgDelay(monitorInfo.result[i].avg_delay) + "ms";
                    tLegendData.push(legendName);
                    tSeries.push({
                            name: legendName,
                            type: 'line',
                            smooth: true,
                            symbol: 'none',
                            data: data,
                            markLine: {
                                symbol: "none",
                                symbolSize :0,
                                data: datal
                            },
                            markPoint: {
                                data: [
                                    { type: 'max', symbol: 'pin', name: 'Max', itemStyle: { color: rgbaColorMarker }, symbolSize: 30, label: { fontSize: 8 } },
                                    { type: 'min', symbol: 'pin', name: 'Min', itemStyle: { color: rgbaColorMarker }, symbolSize: 30, label: { fontSize: 8, offset: [0, 7.5] }, symbolRotate: 180 }
                                ]
                            }
                    });
                }
                this.option.title.text = monitorInfo.server_name;
                this.option.series = tSeries;
                this.option.legend.data = tLegendData;
                const maxLegendsPerRowMobile = localStorage.getItem("maxLegendsPerRowMobile") ? localStorage.getItem("maxLegendsPerRowMobile") : 2;
                const maxLegendsPerRowPc = localStorage.getItem("maxLegendsPerRowPc") ? localStorage.getItem("maxLegendsPerRowPc") : 6;
                const autoIncrement = Math.floor((tLegendData.length - 1) / (this.isMobile ? maxLegendsPerRowMobile : maxLegendsPerRowPc)) * (this.isMobile ? 28 : 34);
                const height = 520 + autoIncrement;
                const gridTop = 60 + autoIncrement;
                this.option.grid = {
                    left: this.isMobile ? '8%' : '3.8%',
                    right: this.isMobile ? '8%' : '3.8%',
                    top: gridTop
                };
                this.myChart.resize({
                    width: 'auto',
                    height: height
                });
                this.myChart.clear();
                this.myChart.setOption(this.option);
            },
            isWindowsPlatform(str) {
                return str.includes('Windows')
            },
            renderChart() {
              const chartTheme = $('html').attr('nz-theme') == "dark" ? "dark" : "";
              this.myChart = echarts.init(this.$refs.chartDom,chartTheme);
              this.myChart.setOption(this.option);
            },
            resizeHandle () {
              this.myChart.resize();
            },
        },
        beforeDestroy() {
            this.myChart.dispose();
            this.myChart = null;
        },
    });
  });
});
</script>
