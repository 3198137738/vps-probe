		<title>云监控</title>
		<meta charset="utf-8">
		<meta http-equiv="X-UA-Compatible" content="IE=edge">
		<meta name="viewport" content="width=device-width, initial-scale=1.0">
		<meta name="description" content="云监控">

		<link rel="stylesheet" href="css/light.css" title="light">
		<link rel="stylesheet" href="css/dark.css" title="dark">
		<style>
			body {
				padding-top: 70px;
				padding-bottom: 30px;
			}
			/* 三网延迟：三个独立圆角标签，按延迟/丢包分别着色 */
			#servers td#ping { min-width: 170px; }
			#servers td#ping .progress.ping-wrap { background: none; box-shadow: none; overflow: visible; }
			#servers td#ping .progress-bar.ping-bar {
				display: flex; background: none; box-shadow: none; text-shadow: none;
			}
			.ping-bar .pv {
				flex: 1; margin-left: 3px; border-radius: 4px; color: #fff; font-size: 12px; line-height: 20px;
				white-space: nowrap; text-shadow: 0 -1px 0 rgba(0,0,0,.2);
				box-shadow: inset 0 -1px 0 rgba(0,0,0,.15);
				background-image: linear-gradient(to bottom, #5cb85c 0, #449d44 100%);
			}
			.ping-bar .pv:first-child { margin-left: 0; }
			.ping-bar .pv.mid  { background-image: linear-gradient(to bottom, #f0ad4e 0, #ec971f 100%); }
			.ping-bar .pv.bad  { background-image: linear-gradient(to bottom, #d9534f 0, #c9302c 100%); }
			.ping-bar .pv.none { background-image: linear-gradient(to bottom, #aaa 0, #888 100%); }
			.ping-bar .pv.dead { background-image: linear-gradient(to bottom, #a52a2a 0, #8b1a1a 100%); }
			/* 三网 24 小时丢包图：表格中悬停弹出，展开详情中直接显示 */
			#servers td#ping .progress-bar.ping-bar { position: relative; overflow: visible; }
			.ping-bar .p24-pop {
				display: none; position: absolute; right: 0; top: 24px; z-index: 1000;
				background: #fff; color: #333; border: 1px solid #ccc; border-radius: 4px;
				box-shadow: 0 4px 12px rgba(0,0,0,.3); padding: 8px 12px;
			}
			.ping-bar:hover .p24-pop { display: block; }
			.p24 { width: 600px; max-width: 90vw; font-size: 12px; line-height: 1.5; text-align: left; display: inline-block; }
			.p24-head { font-weight: bold; margin-bottom: 6px; }
			.p24-head span { font-weight: normal; color: #888; margin-left: 8px; }
			.p24-row { display: flex; align-items: flex-end; margin: 6px 0; }
			.p24-name { width: 36px; font-weight: bold; }
			.p24-bars { flex: 1; display: flex; align-items: flex-end; height: 24px; }
			.p24-bars i { flex: 1; margin-right: 1px; border-radius: 1px; background: #4caf50; }
			.p24-sum { width: 110px; text-align: right; color: #666; white-space: nowrap; }
			.p24-axis { display: flex; justify-content: space-between; margin: 0 110px 0 36px; color: #888; }
			.p24-legend { margin-top: 4px; color: #888; }
			.p24-legend b { display: inline-block; width: 9px; height: 9px; margin: 0 3px 0 8px; border-radius: 1px; }
			.p24 .c0 { background: #4caf50; }
			.p24 .c1 { background: #d4c400; }
			.p24 .c2 { background: #f44336; }
			.p24 .c3 { background: #8b1a1a; }
			.p24 .cx { background: #9e9e9e; }
			.p24-bars i.ce { background: rgba(128,128,128,.18); }
			#servers .expandRow .p24 { margin-top: 6px; }
		</style>
