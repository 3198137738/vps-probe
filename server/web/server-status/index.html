    <style>
        /* 节点详情中的三网延迟卡片 */
        .nz-ping-card { margin: 10px 0 6px; border: 1px solid #e5e7eb; border-radius: 12px; background: rgba(255,255,255,0.92); overflow: hidden; text-align: left; }
        .nz-ping-head { display: flex; flex-wrap: wrap; border-bottom: 1px solid #e5e7eb; }
        .nz-ping-title, .nz-ping-stat { padding: 16px 24px; }
        .nz-ping-title { flex: 0 0 150px; display: flex; flex-direction: column; justify-content: center; border-right: 1px solid #e5e7eb; }
        .nz-ping-stat { flex: 1 1 0; min-width: 0; border-right: 1px solid #e5e7eb; }
        .nz-ping-stat:last-child { border-right: none; }
        .nz-ping-server { font-size: 18px; font-weight: 700; color: #111; word-break: break-all; }
        .nz-ping-label { font-size: 13px; color: #666; margin-top: 2px; }
        .nz-ping-value { font-size: 24px; font-weight: 700; color: #111; line-height: 1.3; }
        .nz-ping-sub { font-size: 13px; color: #777; }
        .nz-ping-sub span { margin-right: 8px; }
        .nz-ping-down { color: #16a34a; }
        .nz-ping-up { color: #dc2626; }
        body[theme="dark"] .nz-ping-card { background: rgba(28,29,38,0.85); border-color: rgba(255,255,255,0.1); }
        body[theme="dark"] .nz-ping-head, body[theme="dark"] .nz-ping-title, body[theme="dark"] .nz-ping-stat { border-color: rgba(255,255,255,0.1); }
        body[theme="dark"] .nz-ping-server, body[theme="dark"] .nz-ping-value { color: #f1f1f1; }
        body[theme="dark"] .nz-ping-label, body[theme="dark"] .nz-ping-sub { color: #a0a4ae; }
        body[theme="dark"] .nz-ping-down { color: #22c55e; }
        body[theme="dark"] .nz-ping-up { color: #f87171; }
        @media (max-width: 768px) {
            .nz-ping-title { flex: 1 0 100%; border-right: none; border-bottom: 1px solid #e5e7eb; padding: 10px 12px; }
            body[theme="dark"] .nz-ping-title { border-color: rgba(255,255,255,0.1); }
            .nz-ping-stat { padding: 10px 12px; }
            .nz-ping-value { font-size: 17px; }
            .nz-ping-label, .nz-ping-sub { font-size: 11px; }
            .nz-ping-sub span { margin-right: 4px; }
        }
    </style>
</head>

<!--  showGroup true -->
<template v-if="showGroup">
    <div class="container-fluid table-responsive content" v-for="group in nodesTag">
        
<table class="table table-striped table-condensed table-hover">
    <thead>
    <tr class="node-group-tag">
        <th colspan="16" style="border:none;">@#(group.Tag!==''?group.Tag:'默认')#@</th>
    </tr>
    <tr class="node-group-cell">
        <th class="node-cell status center">状态</th>
        <th class="node-cell name center">名称</th>
        <th class="node-cell os center">系统</th>
        <th class="node-cell location center">位置</th>
        <th v-if="group.data.some(item => item.additional && item.additional.price && Object.keys(item.additional.price).length > 0)" class="node-cell price center">价格</th>
        <th class="node-cell uptime center">在线</th>
        <th class="node-cell load center">负载</th>
        <th class="node-cell network center">网速↓|↑</th>
        <th class="node-cell traffic center">流量↓|↑</th>
        <th class="node-cell cpu center">核心</th>
        <th class="node-cell memory center">内存</th>
        <th class="node-cell hdd center">硬盘</th>
        <th v-if="group.data.some(item => item.additional && item.additional.remaining && Object.keys(item.additional.remaining).length > 0)" class="node-cell remaining center">剩余</th>
    </tr>
    </thead>
    <tbody id="servers">
    <template v-for="(node,index) in group.data">
        <tr :id="'r'+node.ID" data-toggle="collapse" :data-target="'#rt'+node.ID" class="accordion-toggle"
            :class="index % 2 === 0 ? 'odd': 'even'" aria-expanded="false" @click="showCharts(node.ID)">
            <td class="node-cell status center">
                <div class="status-container">
                    <div v-if="node.online" class="status-icon online"></div>
                    <div v-else class="status-icon offline"></div>
                </div>
            </td>
            <td class="node-cell name center">@#node.name#@</td>
            <td class="node-cell os center">
                <i v-if='isWindowsPlatform(node.host.Platform)' class="windows icon"></i>
                <i v-else-if='getFontLogoClass(node.host.Platform) == "" && node.stateuptime > 0' class="fl-tux"></i>
                <i v-else :class="'fl-' + getFontLogoClass(node.host.Platform)"></i>
                <span class="node-cell-os-text">@#getPlatformName(node.os) === '' && node.stateuptime > 0 ? 'linux' : getPlatformName(node.os)#@</span>
            </td>
            <td class="node-cell location center">
                <i :class="'fi fi-' + (node.stateuptime > 0 ? (node.location || 'un') : '')"></i>
                <span class="node-cell-location-text text-uppercase">@#node.stateuptime > 0 ? (node.location || 'UN') : ''#@</span>
            </td>
            <td v-if="group.data.some(item => item.additional && item.additional.price && Object.keys(item.additional.price).length > 0)" class="node-cell price center">
                <template v-if="node.additional && node.additional.price">
                    <span v-if="node.additional.price.amount == 0" class="node-cell-price-text">FREE</span>
                    <span v-else-if="node.additional.price.amount == -1" class="node-cell-price-text">PAYG</span>
                    <span v-else class="node-cell-price-text">@#node.additional.price.amount#@@#(node.additional.price.cycle ? '/' + node.additional.price.cycle : '')#@</span>
                </template>
            </td>
            <td style="text-align: center;" class="node-cell uptime">@#node.uptime#@</td>
            <td style="text-align: center;" class="node-cell load">@#node.load#@</td>
            <td style="text-align: center;" class="node-cell network">@#node.network#@</td>
            <td style="text-align: center;" class="node-cell traffic">@#node.traffic#@</td>
            <td class="node-cell cpu">
                <div :class="['progress', node.online ? 'progress-online' : 'progress-offline']">
                    <div :style="node.cpu.style" :class="node.cpu.class"><small>@#node.cpu.percent#@%</small>
                    </div>
                </div>
            </td>
            <td class="node-cell memory">
                <div :class="['progress', node.online ? 'progress-online' : 'progress-offline']">
                    <div :style="node.memory.style" :class="node.memory.class">
                        <small>@#node.memory.percent#@%</small>
                    </div>
                </div>
            </td>
            <td class="node-cell hdd">
                <div :class="['progress', node.online ? 'progress-online' : 'progress-offline']">
                    <div :style="node.hdd.style" :class="node.hdd.class"><small>@#node.hdd.percent#@%</small>
                    </div>
                </div>
            </td>
            <td v-if="group.data.some(item => item.additional && item.additional.remaining && Object.keys(item.additional.remaining).length > 0)" class="node-cell remaining">
                <div :class="['progress', node.online ? 'progress-online' : 'progress-offline']">
                    <template v-if="node.additional && node.additional.remaining.format">
                        <div :style="node.additional.remaining.format.style" :class="node.additional.remaining.days == 'lifetime' ? '' : node.additional.remaining.format.class"></div>
                        <div class="additional">
                            <small v-if="node.additional.remaining.days == 'lifetime'">永续</small>
                            <small v-else-if="node.additional.remaining.days < 0">已到期</small>
                            <small v-else>
                                <span class="node-cell-remaining-days">@#node.additional.remaining.days#@天</span>
                                <span class="node-cell-remaining-percent">@#node.additional.remaining.percent#@%</span>
                            </small>
                        </div>
                    </template>
                </div>
            </td>
        </tr>
        <tr class="expandRow" :class="index % 2 === 0 ? 'odd': 'even'">
            <td colspan="16">
                <div class="accordian-body collapse" :id="'rt'+node.ID">
                    <div style="display: flex;left-items: center;justify-content: center;flex-direction: column; max-width: 89vw">
                        <span v-if="node.additional && Object.keys(node.additional.plan).length > 0" class="node-cell-expand">
                            <span class="node-cell-expand-label">套餐:</span>
                            <span v-if="node.additional && Object.keys(node.additional.price).length > 0" class="plan price">
                                <span v-if="node.additional.price.amount == 0">FREE</span>
                                <span v-else-if="node.additional.price.amount == -1">PAYG</span>
                                <span v-else><i class="bi bi-cash-stack"></i> @#node.additional.price.amount#@@#(node.additional.price.cycle ? '/' + node.additional.price.cycle : '')#@</span>           
                            </span>
                            <span v-if="node.additional && node.additional.remaining.endDate" class="plan enddate">
                                <span v-if="node.additional.remaining.days == 'lifetime'">永续</span>
                                <span v-else-if="node.additional.remaining.days < 0">已到期</span>
                                <span v-else><i class="bi bi-clock-history"></i> @#node.additional.remaining.endDate.toISOString().split('T')[0]#@</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.bandwidth" class="plan bandwidth">
                                <i class="bi bi-speedometer2"></i>
                                <span>@#node.additional.plan.bandwidth#@</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.trafficVol" class="plan traffics">
                                <i v-if="node.additional && node.additional.plan.trafficType == 1" class="bi bi-arrow-up"></i>
                                <i v-else-if="node.additional && node.additional.plan.trafficType == 3" class="bi bi-arrows-collapse"></i>
                                <i v-else class="bi bi-arrow-down-up"></i>
                                <span>@#node.additional.plan.trafficVol#@</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.ipv4" class="plan ipv4">
                                <span>IPv4</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.ipv6" class="plan ipv6">
                                <span>IPv6</span>
                            </span>
                            <template v-if="node.additional && node.additional.plan.networkRoute.length>0" v-for="(item, index) in node.additional.plan.networkRoute" :key="index">
                                <span class="plan network-route" :class="{ last: index === node.additional.plan.networkRoute.length - 1 }">
                                    <span>@#item#@</span>
                                </span>
                            </template>
                            <template v-if="node.additional && node.additional.plan.extra.length>0" v-for="(item, index) in node.additional.plan.extra" :key="index">
                                <span class="plan extra" :class="{ last: index === node.additional.plan.extra.length - 1 }">
                                    <span>@#item#@</span>
                                </span>
                            </template>
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">系统:</span>
                            <span v-if="node.host.Platform">@#node.host.Platform#@@#node.host.PlatformVersion ? '-' + node.host.PlatformVersion : ''#@</span>
                            <span v-if="node.host.Arch">[@#node.host.Virtualization ? node.host.Virtualization + ':' : ''#@@#node.host.Arch#@]</span>
                        </span>
                        <span class="node-cell-expand" v-if="node.host.CPU">
                            <span class="node-cell-expand-label">CPU:</span>
                            @#node.host.CPU.join(",")#@ (@#node.cpu.percent#@%)
                        </span>
                        <span class="node-cell-expand" v-if="node.host.GPU">
                            <span class="node-cell-expand-label">GPU:</span>
                            @#node.host.GPU.join(",")#@ 
                            (@#parseInt(node.state.GPU >=0 ? node.state.GPU : 0)#@%)
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">硬盘:</span>
                            @#formatByteSize(node.state.DiskUsed)#@ / @#formatByteSize(node.host.DiskTotal)#@ (@#node.hdd.percent#@%)
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">内存:</span>
                            @#formatByteSize(node.state.MemUsed)#@ / @#formatByteSize(node.host.MemTotal)#@ (@#node.memory.percent#@%)
                        </span>
                        <span v-if="node.host.SwapTotal > 0" class="node-cell-expand">
                            <span class="node-cell-expand-label">交换:</span>
                            @#formatByteSize(node.state.SwapUsed)#@ / @#formatByteSize(node.host.SwapTotal)#@
                            <span>(@#toFixed2(node.state.SwapUsed / node.host.SwapTotal * 100)#@%)</span>
                        </span>
                        <span v-else class="node-cell-expand">
                            <span class="node-cell-expand-label">交换: OFF</span>
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">流量:</span>
                            IN @#formatByteSize(node.state.NetInTransfer)#@ / OUT @#formatByteSize(node.state.NetOutTransfer)#@
                        </span>
                        <span class="node-cell-expand load">
                            <span class="node-cell-expand-label">负载:</span>
                            @#toFixed2(node.state.Load1)#@ / @#toFixed2(node.state.Load5)#@ / @#toFixed2(node.state.Load15)#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">进程数:</span>
                            @#node.state.ProcessCount#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">连接数:</span>
                            TCP @#node.state.TcpConnCount#@ / UDP @#node.state.UdpConnCount#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">启动:</span>
                            @#formatTimestamp(node.host.BootTime)#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">活动:</span>
                            @#new Date(node.lastActive).toLocaleString()#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">在线:</span>
                            @#node.uptime#@
                        </span>
                        <span v-if="node.state.Temperatures && getTemperature(node.state.Temperatures, sensorList) > 0" @click="toggleDetailedTemp(node.ID)" class="node-cell-expand temp-detail" :id="`temp-${node.ID}`" temp-detail-show="0">
                            <span class="node-cell-expand-label">温度:</span>
                            <span :id="`temp-main-${node.ID}`" class="node-cell-expand-label">
                                @#getTemperature(node.state.Temperatures, sensorList)#@°C
                                <i class="bi bi-chevron-double-down"></i>
                            </span>
                            <span :id="`temp-detail-${node.ID}`" class="node-cell-expand-label" style="display:none">
                                <span v-for="temp in node.state.Temperatures" :key="temp.Name" v-if="temp.Temperature !== 0">
                                   [ @#temp.Name#@ : @#temp.Temperature#@°C ]
                                </span>
                                <i class="bi bi-chevron-double-up"></i>
                            </span>
                        </span>
                        <span class="node-echarts-expand">
                            <div class="chartbox" :id="`chart-${node.ID}`" chartbox-show="0" :key="node.ID" style="width: 100%; height: auto;"></div>
                        </span>
                    </div>
                </div>
            </td>
        </tr>
    </template>
    </tbody>
</table>
 
    </div>
</template>

    <template v-for="(node,index) in nodesNoTag">

            </td>
            <td class="node-cell hdd">
                <div :class="['progress', node.online ? 'progress-online' : 'progress-offline']">
                    <div :style="node.hdd.style" :class="node.hdd.class"><small>@#node.hdd.percent#@%</small>
                    </div>
                </div>
            </td>
            <td v-if="nodesNoTag.some(item => item.additional && item.additional.remaining && Object.keys(item.additional.remaining).length > 0)" class="node-cell remaining">
                <div :class="['progress', node.online ? 'progress-online' : 'progress-offline']">
                    <template v-if="node.additional && node.additional.remaining.format">
                        <div :style="node.additional.remaining.format.style" :class="node.additional.remaining.days == 'lifetime' ? '' : node.additional.remaining.format.class"></div>
                        <div class="additional">
                            <small v-if="node.additional.remaining.days == 'lifetime'">永续</small>
                            <small v-else-if="node.additional.remaining.days < 0">已到期</small>
                            <small v-else>
                                <span class="node-cell-remaining-days">@#node.additional.remaining.days#@天</span>
                                <span class="node-cell-remaining-percent">@#node.additional.remaining.percent#@%</span>
                            </small>
                        </div>
                    </template>
                </div>
            </td>
        </tr>
        <tr class="expandRow" :class="index % 2 === 0 ? 'odd': 'even'">
            <td colspan="16">
                <div class="accordian-body collapse" :id="'rt'+node.ID">
                    <div style="display: flex;left-items: center;justify-content: center;flex-direction: column; max-width: 89vw">
                        <span v-if="node.additional && Object.keys(node.additional.plan).length > 0" class="node-cell-expand">
                            <span class="node-cell-expand-label">套餐:</span>
                            <span v-if="node.additional && Object.keys(node.additional.price).length > 0" class="plan price">
                                <span v-if="node.additional.price.amount == 0">FREE</span>
                                <span v-else-if="node.additional.price.amount == -1">PAYG</span>
                                <span v-else><i class="bi bi-cash-stack"></i> @#node.additional.price.amount#@@#(node.additional.price.cycle ? '/' + node.additional.price.cycle : '')#@</span>           
                            </span>
                            <span v-if="node.additional && node.additional.remaining.endDate" class="plan enddate">
                                <span v-if="node.additional.remaining.days == 'lifetime'">永续</span>
                                <span v-else-if="node.additional.remaining.days < 0">已到期</span>
                                <span v-else><i class="bi bi-clock-history"></i> @#node.additional.remaining.endDate.toISOString().split('T')[0]#@</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.bandwidth" class="plan bandwidth">
                                <i class="bi bi-speedometer2"></i>
                                <span>@#node.additional.plan.bandwidth#@</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.trafficVol" class="plan traffics">
                                <i v-if="node.additional && node.additional.plan.trafficType == 1" class="bi bi-arrow-up"></i>
                                <i v-else-if="node.additional && node.additional.plan.trafficType == 3" class="bi bi-arrows-collapse"></i>
                                <i v-else class="bi bi-arrow-down-up"></i>
                                <span>@#node.additional.plan.trafficVol#@</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.ipv4" class="plan ipv4">
                                <span>IPv4</span>
                            </span>
                            <span v-if="node.additional && node.additional.plan.ipv6" class="plan ipv6">
                                <span>IPv6</span>
                            </span>
                            <template v-if="node.additional && node.additional.plan.networkRoute.length>0" v-for="(item, index) in node.additional.plan.networkRoute" :key="index">
                                <span class="plan network-route" :class="{ last: index === node.additional.plan.networkRoute.length - 1 }">
                                    <span>@#item#@</span>
                                </span>
                            </template>
                            <template v-if="node.additional && node.additional.plan.extra.length>0" v-for="(item, index) in node.additional.plan.extra" :key="index">
                                <span class="plan extra" :class="{ last: index === node.additional.plan.extra.length - 1 }">
                                    <span>@#item#@</span>
                                </span>
                            </template>
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">系统:</span>
                            <span v-if="node.host.Platform">@#node.host.Platform#@@#node.host.PlatformVersion ? '-' + node.host.PlatformVersion : ''#@</span>
                            <span v-if="node.host.Arch">[@#node.host.Virtualization ? node.host.Virtualization + ':' : ''#@@#node.host.Arch#@]</span>
                        </span>
                        <span class="node-cell-expand" v-if="node.host.CPU">
                            <span class="node-cell-expand-label">CPU:</span>
                            @#node.host.CPU.join(",")#@ (@#node.cpu.percent#@%)
                        </span>
                        <span class="node-cell-expand" v-if="node.host.GPU">
                            <span class="node-cell-expand-label">GPU:</span>
                            @#node.host.GPU.join(",")#@ 
                            (@#parseInt(node.state.GPU >=0 ? node.state.GPU : 0)#@%)
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">硬盘:</span>
                            @#formatByteSize(node.state.DiskUsed)#@ / @#formatByteSize(node.host.DiskTotal)#@ (@#node.hdd.percent#@%)
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">内存:</span>
                            @#formatByteSize(node.state.MemUsed)#@ / @#formatByteSize(node.host.MemTotal)#@ (@#node.memory.percent#@%)
                        </span>
                        <span v-if="node.host.SwapTotal > 0" class="node-cell-expand">
                            <span class="node-cell-expand-label">交换:</span>
                            @#formatByteSize(node.state.SwapUsed)#@ / @#formatByteSize(node.host.SwapTotal)#@
                            <span>(@#toFixed2(node.state.SwapUsed / node.host.SwapTotal * 100)#@%)</span>
                        </span>
                        <span v-else class="node-cell-expand">
                            <span class="node-cell-expand-label">交换: OFF</span>
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">流量:</span>
                            IN @#formatByteSize(node.state.NetInTransfer)#@ / OUT @#formatByteSize(node.state.NetOutTransfer)#@
                        </span>
                        <span class="node-cell-expand load">
                            <span class="node-cell-expand-label">负载:</span>
                            @#toFixed2(node.state.Load1)#@ / @#toFixed2(node.state.Load5)#@ / @#toFixed2(node.state.Load15)#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">进程数:</span>
                            @#node.state.ProcessCount#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">连接数:</span>
                            TCP @#node.state.TcpConnCount#@ / UDP @#node.state.UdpConnCount#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">启动:</span>
                            @#formatTimestamp(node.host.BootTime)#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">活动:</span>
                            @#new Date(node.lastActive).toLocaleString()#@
                        </span>
                        <span class="node-cell-expand">
                            <span class="node-cell-expand-label">在线:</span>
                            @#node.uptime#@
                        </span>
                        <span v-if="node.state.Temperatures && getTemperature(node.state.Temperatures, sensorList) > 0" @click="toggleDetailedTemp(node.ID)" class="node-cell-expand temp-detail" :id="`temp-${node.ID}`" temp-detail-show="0">
                            <span class="node-cell-expand-label">温度:</span>
                            <span :id="`temp-main-${node.ID}`" class="node-cell-expand-label">
                                @#getTemperature(node.state.Temperatures, sensorList)#@°C
                                <i class="bi bi-chevron-double-down"></i>
                            </span>
                            <span :id="`temp-detail-${node.ID}`" class="node-cell-expand-label" style="display:none">
                                <span v-for="temp in node.state.Temperatures" :key="temp.Name" v-if="temp.Temperature !== 0">
                                   [ @#temp.Name#@ : @#temp.Temperature#@°C ]
                                </span>
                                <i class="bi bi-chevron-double-up"></i>
                            </span>
                        </span>
                        <span class="node-echarts-expand">
                            <div class="chartbox" :id="`chart-${node.ID}`" chartbox-show="0" :key="node.ID" style="width: 100%; height: auto;"></div>
                        </span>
                    </div>
                </div>
            </td>
        </tr>
    </template>
    </tbody>
</table>

    </div>
</template>

<script>
nzBoot(function (nzInitServers) {
    new Vue({
        el: '#app',
        delimiters: ['@#', '#@'],
        data: {
            page: 'index',
            defaultTemplate: "server-status",
            templates: {"default": "默认", "server-status": "ServerStatus"},
            cache: [],
            servers: [],
            nodesTag: [],
            nodesNoTag: [],
            additional: {},
            chartDataList: [],
            ws: null,
            language: "zh-CN",
            countryMap: {},
            countryServer: [],
            countryNameMap: {},
            countryMapChartData: [],
            countryMapGeoFile: localStorage.getItem("countryMapGeoFile") ? localStorage.getItem("countryMapGeoFile") : 'nezha.world.geo.json',
            sensorList: [
                'TC0D', //CPU Die 温度，代表 CPU 内部的温度
                'TC0H', //CPU Heatsink 温度，代表 CPU 散热器的温度
                'TC0P', //CPU Proximity 温度，代表 CPU 附近的温度
                'k10temp', //AMD K10（Phenom、Athlon、Sempron 等）系列处理器的温度监测
                'k10temp_tctl', //AMD K10 (Athlon II、Phenom II 等）系列处理器的温度监测
                'coretemp_package_id_0', //整个封装处理器温度
                'cpu_thermal_zone', //全志
                'cpu-thermal', //树莓派(博通)
                'soc_thermal', //新瑞芯微
                'cpu_thermal', //老瑞芯微
                'ACPI\\ThermalZone\\TZ0__0', //Windows
                'ACPI\\ThermalZone\\CPUZ_0', //Windows
                'ACPI\\ThermalZone\\TZ00_0', //Windows
                'ACPI\\ThermalZone\\TZ001_0', //Windows
                'ACPI\\ThermalZone\\THM0_0' //Windows
            ]
        },
        mixins: [mixinsVue],
        created() {
            this.servers = nzInitServers;
            this.additional = this.initAdditional(this.servers);
            if(this.showGroup) {
                this.nodesTag = this.groupingData(this.handleNodes(this.servers),"Tag");
                this.nodesTag.forEach(group => {
                    group.data.forEach(item => {
                        const additionalData = this.additional[item.ID];
                        if (additionalData) {
                            item.additional = additionalData; // 添加 additional 属性
                        }
                    });
                });
            } else {
                this.nodesNoTag = this.handleNodes(this.servers);
                this.nodesNoTag.forEach(item => {
                    const additionalData = this.additional[item.ID];
                    if (additionalData) {
                        item.additional = additionalData; // 添加 additional 属性
                    }
                });
            }
            this.initCountryMap().then(countryMap => {
                this.countryMap = countryMap;
                this.countryNameMap = this.initCountryNameMap();
                this.countryServer = this.initCountryServer();
                this.countryMapChartData = this.initCountryMapChartData();
            });
        },
        mounted() {
            // 初始化时建立WebSocket连接
            this.connect();
            // 监听页面可见性变化
            document.addEventListener("visibilitychange", () => {
                if (document.visibilityState === "visible") {
                    setTimeout(() => {
                        if (document.hasFocus()) {
                            this.connect();
                        }
                    }, 200);
                }
            });
        },
        methods: {
            initAdditional(servers) {
                let nodes = {};
                servers?.forEach(server => {
                    //处理异常
                    if (!server.PublicNote) return;

                    // 初始化节点
                    nodes[server.ID] = {
                        "remaining": {},
                        "price": {},
                        "plan": {}
                    };

                    // 处理 billingDataMod 的 remaining 配置
                    const remainingEndDate = this.getRemainingDays(this.getNoteElementValue(server.PublicNote, "billingDataMod", "endDate"), server.PublicNote, 1);
                    const remainingFormat = this.getRemainingFormat(server.live, server.PublicNote);
                    const remainingDays = this.getRemainingDays(this.getNoteElementValue(server.PublicNote, "billingDataMod", "endDate"), server.PublicNote);
                    const remainingPercent = this.getRemainingPercent(
                        this.getNoteElementValue(server.PublicNote, "billingDataMod", "startDate"),
                        this.getNoteElementValue(server.PublicNote, "billingDataMod", "endDate"),
                        server.PublicNote
                    );
                    // 设置 remaining 属性
                    if (remainingEndDate) nodes[server.ID].remaining.endDate = remainingEndDate;
                    if (remainingFormat) nodes[server.ID].remaining.format = remainingFormat;
                    if (remainingDays) nodes[server.ID].remaining.days = remainingDays;
                    if (remainingPercent) nodes[server.ID].remaining.percent = this.toFixed2(100 - remainingPercent);

                    // 处理 billingDataMod 的 price 配置
                    const priceAmount = this.getNoteElementValue(server.PublicNote, "billingDataMod", "amount");
                    const priceCycle = this.getNoteElementValue(server.PublicNote, "billingDataMod", "cycle");
                    // 设置 price 属性
                    if (priceAmount) nodes[server.ID].price.amount = priceAmount;
                    if (priceCycle && priceAmount) nodes[server.ID].price.cycle = priceCycle;
                    
                    // 处理 planDataMod 配置
                    const planBandwidth = this.getNoteElementValue(server.PublicNote, "planDataMod", "bandwidth");
                    const planTrafficVol = this.getNoteElementValue(server.PublicNote, "planDataMod", "trafficVol");
                    const planTrafficType = this.getNoteElementValue(server.PublicNote, "planDataMod", "trafficType");
                    const planIPv4 = this.getNoteElementValue(server.PublicNote, "planDataMod", "IPv4");
                    const planIPv6 = this.getNoteElementValue(server.PublicNote, "planDataMod", "IPv6");
                    const planNetworkRoute = this.getNoteElementValue(server.PublicNote, "planDataMod", "networkRoute");
                    const planExtra = this.getNoteElementValue(server.PublicNote, "planDataMod", "extra");
                    // 设置 plan 属性
                    if (planBandwidth) nodes[server.ID].plan.bandwidth = planBandwidth;
                    if (planTrafficVol) nodes[server.ID].plan.trafficVol = planTrafficVol;
                    if (planTrafficType) nodes[server.ID].plan.trafficType = planTrafficType;
                    if (planIPv4) nodes[server.ID].plan.ipv4 = planIPv4 >= 1;
                    if (planIPv6) nodes[server.ID].plan.ipv6 = planIPv6 >= 1;
                    if (planNetworkRoute) nodes[server.ID].plan.networkRoute = planNetworkRoute.split(',');
                    if (planExtra) nodes[server.ID].plan.extra = planExtra.split(',');
                });
                return nodes;
            },
            initCountryMap() {
                return fetch(this.staticUrl + '/maps/nezha.countrymap.json')
                    .then(response => response.json())
                    .then(data => {
                        return data;
                    })
            },
            initCountryNameMap(){
                const result = {};
                for (const item in this.countryMap) {
                    result[this.countryMap[item].en] = this.language=='zh-CN' ? this.countryMap[item].zh : this.countryMap[item].en;
                }
                return result;
            },
            initCountryServer() {
                let count = {};
                let result = [];
                let exist = {};
                this.servers.forEach(item => {
                    if (item.Host.CountryCode) {
                        if(this.countryMapGeoFile == 'nezha.world.geo.json' || this.countryMapGeoFile == 'nezha.world.antarctica.geo.json') {
                            if(item.Host.CountryCode.toLowerCase() == 'tw' || item.Host.CountryCode.toLowerCase() == 'hk' || item.Host.CountryCode.toLowerCase() == 'mo') item.Host.CountryCode = 'cn';
                        }
                        if (!exist[item.Host.CountryCode]) {
                            exist[item.Host.CountryCode] = true;
                            count[item.Host.CountryCode] = 1;
                            const obj = {
                                'countryCode': item.Host.CountryCode,
                                'count': count[item.Host.CountryCode]
                            };
                            result.push(obj);
                        } else {
                            count[item.Host.CountryCode]++;
                            result.find(obj => obj.countryCode === item.Host.CountryCode).count = count[item.Host.CountryCode];
                        }
                    }
                });
                return result;
            },
            initCountryMapChartData(){
                let result = [];
                this.countryServer.forEach(item => {
                    var obj = {
                        "name": this.language=='zh-CN' ? this.countryMap[item.countryCode].zh : this.countryMap[item.countryCode].en,
                        "value": item.count
                    }
                    result.push(obj);
                });
                return result;
            },
            showMapChart(){
                // 处理异常
                if( this.countryMapChartData.length == 0 ) {
                    console.log('init countryMapChartData not complete');
                    return;
                }
                const unit = this.language=='zh-CN' ? '台' : 'servers';
                const width = window.innerWidth;
                const height = 0.95 * window.innerHeight;
                const backgroundColor = this.theme == "dark" ? '' : '';
                const inRangeColor = this.theme == "dark" ? '#D2B206' : '#FFDF32';
                const tooltipBackgroundColor = this.theme == "dark" ? "#ffffff" : '#ffffff';
                const tooltipBorderColor = this.theme == "dark" ? "#ffffff" : "#ffffff"; 
                const fontSize = this.isMobile ? 10 : 12;
                const fontColor = this.theme == "dark" ? "#000000" : "#000000"; 
                const showLoadingMaskColor = this.theme == "dark" ? 'rgba(28, 29, 38, 1)' : 'rgba(249, 249, 249, 1)';
                const showLoadingTextColor = this.theme == "dark" ? 'rgba(241, 241, 241, 1)' : 'rgba(0, 0, 0, 1)';
                const showLoadingColor = inRangeColor;    
                const chartContainer = document.getElementById('mapChart');
                const mapChart = echarts.init(chartContainer, '', { // init图表
                    renderer: 'canvas',
                    useDirtyRect: false,
                    width: width,
                    height: height,
                });
                mapChart.showLoading({
                    text: 'loading',
                    textColor: showLoadingTextColor,
                    color: showLoadingColor,
                    maskColor: showLoadingMaskColor,
                    zlevel: 2
                });
                fetch(this.staticUrl + '/maps/' + this.countryMapGeoFile)
                    .then(response => response.json())
                    .then(worldMap => {
                        echarts.registerMap('nezha-world-map', worldMap);
                        const option = {
                            title: {
                                show: false,
                            },
                            backgroundColor: backgroundColor,
                            grid: {
                                top: 0,
                                left: 10,
                                right: 10
                            },
                            tooltip: {
                                trigger: 'item',
                                formatter: function (params) {
                                    if (params.data && params.data.value > 0) {
                                        return params.name + ' ' + params.data.value + ' ' + unit;
                                    } else {
                                        return '';
                                    }
                                },
                                backgroundColor: tooltipBackgroundColor,
                                borderColor: tooltipBorderColor,
                                padding: [4,10],
                                textStyle: {
                                    fontSize: fontSize,
                                    color: fontColor
                                }
                            },
                            visualMap: {
                                show: false,
                                min: 0,
                                max: 1000,
                                calculable: false,
                                inRange: {
                                    color: inRangeColor
                                }
                            },
                            series: [
                                {
                                    type: 'map',
                                    map: 'nezha-world-map',
                                    roam: true,
                                    label: {
                                        show: false,
                                        fontSize: 8
                                    },
                                    data: this.countryMapChartData,
                                    nameMap: this.countryNameMap,
                                }
                            ]
                        };
                        setTimeout(() => {
                            mapChart.hideLoading();
                            mapChart.setOption(option);
                        }, 1000);
                    });
            },
            isWindowsPlatform(str) {
                return str.includes('Windows')
            },
            getPlatformName(str){
                if (str.toLowerCase().includes('opensuse')) {
                    return 'openSUSE';
                }
                return str;
            },
            getFontLogoClass(str) {
                if (["almalinux",
                        "alpine",
                        "aosc",
                        "apple",
                        "archlinux",
                        "archlabs",
                        "artix",
                        "budgie",
                        "centos",
                        "coreos",
                        "debian",
                        "deepin",
                        "devuan",
                        "docker",
                        "elementary",
                        "fedora",
                        "ferris",
                        "flathub",
                        "freebsd",
                        "gentoo",
                        "gnu-guix",
                        "illumos",
                        "kali-linux",
                        "linuxmint",
                        "mageia",
                        "mandriva",
                        "manjaro",
                        "nixos",
                        "openbsd",
                        "opensuse",
                        "pop-os",
                        "raspberry-pi",
                        "redhat",
                        "rocky-linux",
                        "sabayon",
                        "slackware",
                        "snappy",
                        "solus",
                        "tux",
                        "ubuntu",
                        "void",
                        "zorin"].indexOf(str)
                    > -1) {
                    return str;
                }
                if (str == 'darwin') {
                    return 'apple';
                }
                if (['openwrt', 'linux', "immortalwrt"].indexOf(str) > -1) {
                    return 'tux';
                }
                if (str == 'amazon') {
                    return 'redhat';
                }
                if (str == 'arch') {
                    return 'archlinux';
                }
                if (str.toLowerCase().includes('opensuse')) {
                    return 'opensuse';
                }
                return '';
            },
            secondToDate(s) {
                const d = Math.floor(s / 3600 / 24);
                if (d > 0) {
                    return d + ' 天'
                }
                const h = Math.floor(s / 3600 % 24);
                const m = Math.floor(s / 60 % 60);
                const second = Math.floor(s % 60);
                return h + ":" + ("0" + m).slice(-2) + ":" + ("0" + second).slice(-2);
            },
            formatTimestamp(t) {
                return new Date(t * 1000).toLocaleString()
            },
            formatByteSize(bs) {
                const x = this.readableBytes(bs)
                return x !== "NaN undefined" ? x : '0B'
            },
            formatPercent(live, used, total) {
                //const percent = live ? (this.toFixed2(used / total * 100) || 0) : 0
                const percent = (this.toFixed2(used / total * 100) || 0)
                return this.formatPercents(live,percent)
            },
            formatPercents(live,percent) {
                //if(!live) { percent = 0; }
                if (isNaN(percent)) {
                    percent = 0;
                }
                if (percent <= 0) {
                    percent = 0;
                }
                if (percent >= 100) {
                    percent = 100;
                }
                if (!this.cache[percent]) {
                    this.cache[percent] = {
                        class: 'progress-bar progress-bar-success',
                        style: `width: ${parseInt(percent)+1}%`,
                        percent,
                    }
                    if (percent < 80) {
                        this.cache[percent].class = 'progress-bar progress-bar-success'
                    } else if (percent < 90) {
                        this.cache[percent].class = 'progress-bar progress-bar-warning'
                    } else {
                        this.cache[percent].class = 'progress-bar progress-bar-danger'
                    }
                }
                return this.cache[percent]
            },
            readableBytes(bytes) {
                if (!bytes) {
                    return '0B'
                }
                const i = Math.floor(Math.log(bytes) / Math.log(1024)),
                    sizes = ["B", "K", "M", "G", "T", "P", "E", "Z", "Y"];
                return parseFloat((bytes / Math.pow(1024, i)).toFixed(2)) + sizes[i];
            },
            connect() {
                // 如果已经存在 WebSocket 连接并且处于开启状态，则不重复建立连接
                if (this.ws && this.ws.readyState === WebSocket.OPEN) {
                    console.log('Closing old WebSocket connection...');
                    this.ws.close();
                }
                const wsProtocol = window.location.protocol === "https:" ? "wss" : "ws";
                this.ws = new NzSocket();

                this.ws.onopen = function () {
                    console.log("Connection open ...")
                }
                this.ws.onmessage = (evt) => {
                    let jsonData = evt.data
                    const data = JSON.parse(jsonData)
                    for (let i = 0; i < data.servers?.length; i++) {
                        const ns = data.servers[i];
                        if (!ns.Host) {
                            data.servers[i].live = false
                        } else {
                            data.servers[i].live = ns.nzOnline;
                        }
                    }
                    if(this.showGroup) {
                        this.nodesTag = this.groupingData(this.handleNodes(data.servers),"Tag");
                        this.nodesTag.forEach(group => {
                            group.data.forEach(item => {
                                const additionalData = this.additional[item.ID];
                                if (additionalData) {
                                    item.additional = additionalData; // 添加 additional 属性
                                }
                            });
                        });
                    } else {
                        this.nodesNoTag = this.handleNodes(data.servers);
                        this.nodesNoTag.forEach(item => {
                            const additionalData = this.additional[item.ID];
                            if (additionalData) {
                                item.additional = additionalData; // 添加 additional 属性
                            }
                        });
                    }
                }
                this.ws.onclose = () => {
                    setTimeout(() => {
                        this.connect();
                    }, 5000);
                };
                this.ws.onerror = () => {
                    this.ws.close()
                }
            },
            handleNodes(servers) {
                let nodes = []
                servers?.forEach(server => {
                    let platform = server.Host.Platform;
                    if (this.isWindowsPlatform(platform)) {
                        platform = "windows"
                    }else if (platform === "immortalwrt") {
                        platform = "openwrt"
                    }
                    let node = {
                        ID: server.ID,
                        name: server.Name,
                        os: platform,
                        location: server.Host.CountryCode,
                        stateuptime: server.State.Uptime,
                        uptime: this.secondToDate(server.State.Uptime),
                        load: this.toFixed2(server.State.Load1),
                        network: this.getNetworkSpeed(server.State.NetInSpeed, server.State.NetOutSpeed),
                        traffic: this.formatByteSize(server.State.NetInTransfer) + ' | ' + this.formatByteSize(server.State.NetOutTransfer),
                        cpu: this.formatPercents(server.live, this.toFixed2(server.State.CPU)),
                        memory: this.formatPercent(server.live, server.State.MemUsed, server.Host.MemTotal),
                        hdd: this.formatPercent(server.live, server.State.DiskUsed, server.Host.DiskTotal),
                        online: server.live,
                        state: server.State,
                        host: server.Host,
                        lastActive: server.LastActive,
                        Tag: server.Tag,
                    }
                    nodes.push(node)
                })
                return nodes;
            },
            getNetworkSpeed(netInSpeed, netOutSpeed) {
                return this.formatByteSize(netInSpeed) + ' | ' + this.formatByteSize(netOutSpeed)
            },
            toggleDetailedTemp(id){
                const tempDom = document.getElementById(`temp-${id}`); 
                const tempDetailShow = tempDom.getAttribute('temp-detail-show');
                const tempMain = document.getElementById(`temp-main-${id}`); 
                const tempDetail = document.getElementById(`temp-detail-${id}`); 
                if (tempDetailShow == 0){
                    tempMain.style.display = 'none';
                    tempDetail.style.display = 'inline';
                    tempDom.setAttribute('temp-detail-show', 1);
                } else {
                    tempMain.style.display = 'inline';
                    tempDetail.style.display = 'none';
                    tempDom.setAttribute('temp-detail-show', 0);
                }
            },
            getTemperature(temperatureList, sensorList) {
                // 将 sensorList 中的所有项转换为小写
                const lowerCaseSensorList = sensorList.map(sensor => sensor.toLowerCase());

                // 合并过滤逻辑：过滤出 Temperature 不为 0 且 Name 在 sensorList 中的元素（忽略大小写）
                const filtered = temperatureList.filter(item => item.Temperature !== 0 && lowerCaseSensorList.includes(item.Name.toLowerCase()));

                // 如果有匹配的元素，则计算这些元素的 Temperature 的最大值
                if (filtered.length > 0) {
                    return filtered.reduce((max, current) => {
                        return current.Temperature > max ? current.Temperature : max;
                    }, filtered[0].Temperature);
                }

                // 如果没有匹配的元素，则计算 temperatureList 中所有 Temperature 不为 0 的元素的最大值
                const nonZeroTemps = temperatureList.filter(item => item.Temperature !== 0);
                if (nonZeroTemps.length > 0) {
                    return nonZeroTemps.reduce((max, current) => {
                        return current.Temperature > max ? current.Temperature : max;
                    }, nonZeroTemps[0].Temperature);
                }

                // 如果所有元素的 Temperature 都为 0，则返回一个默认值 0
                return 0;
            },

                    return {
                        name: item.monitor_name,
                        color: colors[item.monitor_name] || fallbackColors[k % 3],
                        avg: ok.length ? (ok.reduce((a, b) => a + b, 0) / ok.length).toFixed(2) + 'ms' : '-',
                        min: ok.length ? Math.round(Math.min(...ok)) : '-',

                const fontSize = this.isMobile ? 11 : 13;

                const tooltipBackgroundColor = dark ? (this.semiTransparent ? "rgba(28,29,38,0.85)" : "rgba(28,29,38,1)") : (this.semiTransparent ? "rgba(255,255,255,0.85)" : "rgba(255,255,255,1)");
                // 纵轴分 4 格，上限取整到便于阅读的数值（如 3800ms → 每格 950ms）
                const maxDelay = Math.max(1, ...lines.flatMap(l => l.data.map(d => d[1] || 0)));
                const step = maxDelay > 400 ? 200 : 20;

                    renderer: 'canvas',

                });

                    tooltip: {

                        padding: 0,
                        extraCssText: 'border-radius:8px;box-shadow:0 4px 16px rgba(0,0,0,0.12);',
                        // 标题为完整时间，下方每条线路名称居左、延迟居右

            reloadCharts() {
                this.servers.forEach(node => {
                    const id = node.ID;
                    const chartData = this.chartDataList[id];

            },
            getNoteElementValue(string, elementName, childElementName) {
                let obj;

                try {
                    obj = JSON.parse(string);
                } catch (e) {
                    return null; 
                }

                if (!elementName) return null;

                if (childElementName) {
                    return obj[elementName] && childElementName in obj[elementName] ? obj[elementName][childElementName] : null;
                } else {
                    return elementName in obj ? obj[elementName] : null;
                }
            },
            getBillingCycle(billingCycle) { 
                // 统一转换为小写进行比较
                const cycle = billingCycle.toLowerCase();

                switch (cycle) {
                    case '月':
                    case 'mo':
                    case 'month':
                    case 'monthly':
                    case 'm':
                        return "M";
                    case '季':
                    case 'quarterly':
                    case 'q':
                        return "Q";                        
                    case '半':
                    case '半年':
                    case 'half':
                    case 'semi-annually':
                    case 'h':
                        return "H";                        
                    case '年':
                    case 'yr':
                    case 'year':
                    case 'annually':
                    case 'y':
                        return "Y";
                    default:
                        return null;
                }                
            },
            getAdjustTimezone(reference, target) {
                // 获取时区
                const referenceTimezoneOffset = reference.getTimezoneOffset(); 
                const targetTimezoneOffset = target.getTimezoneOffset();

                // 计算时区差异
                const timezoneDifference = (referenceTimezoneOffset - targetTimezoneOffset) * 60 * 1000;

                // 将 target 日期调整到 reference 时区
                return new Date(target.getTime() + timezoneDifference);
            },
            getAutoRenewalEndDate(endDate, billingCycle) {
                const expiration = new Date(endDate);
                const current = this.getAdjustTimezone(new Date(endDate), new Date());

                // 如果 expiration 无效，记录日志
                if (isNaN(expiration.getTime())) {
                    console.log("getAutoRenewalEndDate: Invalid expiration format");
                }

                const result = {
                    flag: 1,  // 1表示需要更新
                    check: 0, // 判断逻辑标记
                    count: 0  // 周期累计计数
                };

                // 如果当前时间还没到到期时间，直接返回到期时间
                if (current < expiration) {
                    result.flag = 0;
                    result.date = expiration;
                    return result;
                }

                let nextExpiration = new Date(expiration); // 初始化为原到期时间
                let newExpirationMonth = expiration.getMonth(); // 获取expiration初始月份

                switch (billingCycle.toUpperCase()) {
                    case 'M': // 月度
                        nextExpiration.setFullYear(current.getFullYear());

                        const monthCheck = current < new Date(current.getFullYear(), current.getMonth(), expiration.getDate());

                        // 检查当前月是否在有效期内
                        if (monthCheck) {
                            nextExpiration.setMonth(current.getMonth());
                            result.check = 1;
                        } else {
                            nextExpiration.setMonth(current.getMonth() + 1);
                            result.check = 2;
                        }
                        break;

                    case 'Q': // 季度
                        nextExpiration.setFullYear(current.getFullYear());

                        // 每次增加 3 个月，直到新的月份大于当前月份
                        while (newExpirationMonth < current.getMonth()) {
                            newExpirationMonth += 3;
                            result.count += 1;
                        }

                        // nextExpiration设置获取到的新月份
                        nextExpiration.setMonth(newExpirationMonth);

                        const quarterlyCheck = current < nextExpiration;

                        // 检查新月份是否在有效期内
                        if (quarterlyCheck) {
                            result.check = 3;
                        } else {
                            nextExpiration.setMonth(current.getMonth() + 3);
                            result.check = 4;
                            result.count += 1;
                        }
                        break;

                    case 'H': // 半年
                        nextExpiration.setFullYear(current.getFullYear());
                
                        // 每次增加 6 个月，直到新的月份大于当前月份
                        while (newExpirationMonth < current.getMonth()) {
                            newExpirationMonth += 6;
                            result.count += 1;
                        }

                        // nextExpiration设置获取到的新月份
                        nextExpiration.setMonth(newExpirationMonth);

                        const halfCheck = current < nextExpiration;

                        // 检查新月份是否在有效期内
                        if (halfCheck) {
                            result.check = 5;
                        } else {
                            nextExpiration.setMonth(current.getMonth() + 6);
                            result.check = 6;
                            result.count += 1;
                        }    
                        break;

                    case 'Y': // 年度
                        const yearCheck = current < new Date(current.getFullYear(), expiration.getMonth(), expiration.getDate());

                        // 如果当前时间比这一年有效期早，则到期为本年
                        if (yearCheck) {
                            nextExpiration.setFullYear(current.getFullYear());
                            result.check = 7;
                        } else {
                            // 否则推到下一年
                            nextExpiration.setFullYear(current.getFullYear() + 1);
                            result.check = 8;
                        }
                        break;

                    default:
                        throw new Error("Invalid billing cycle");
                }

                // 保持原到期时间的时分秒
                nextExpiration.setHours(expiration.getHours());
                nextExpiration.setMinutes(expiration.getMinutes());
                nextExpiration.setSeconds(expiration.getSeconds());

                result.date = nextExpiration;

                return result;
            },
            getAutoRenewalStartDate(flag, startDate, check, count) {
                //1.判断什么时候改变 2.如何改变
                const start = new Date(startDate);
                const current = this.getAdjustTimezone(start, new Date());

                // 检查 startDate 格式是否有效，若无效返回 null
                if (isNaN(start.getTime())) {
                    console.log("getAutoRenewalStartDate: Invalid startDate format");
                }

                // 如果 flag 为 0，直接返回开始日期
                if (flag === 0) {
                    return start;
                } 

                // 初始化新的开始日期
                const newStart = new Date(start);

                switch (check) {
                    case 1: // 处理月份：设置为上个月
                        newStart.setFullYear(current.getFullYear());
                        newStart.setMonth(current.getMonth() - 1);
                        break;

                    case 2: // 处理月份：设置为当前月
                        newStart.setFullYear(current.getFullYear());
                        newStart.setMonth(current.getMonth());
                        break;

                    case 3:
                    case 4: // 处理季度
                        newStart.setFullYear(current.getFullYear());
                        newStart.setMonth(start.getMonth() + 3 * count);
                        break;

                    case 5:
                    case 6: // 处理半年
                        newStart.setFullYear(current.getFullYear());
                        newStart.setMonth(start.getMonth() + 6 * count);
                        break;

                    case 7: // 处理年份：设置为上一年
                        newStart.setFullYear(current.getFullYear() - 1);
                        break;

                    case 8: // 处理年份：保持当前年份
                        newStart.setFullYear(current.getFullYear());
                        break;

                    default: // 默认处理：直接返回
                        return;
                }

                return newStart;
            },
            getRemainingFormat(online, note) {
                if (!note) return null;
                const startDate = this.getNoteElementValue(note, "billingDataMod", "startDate");
                const endDate = this.getNoteElementValue(note, "billingDataMod", "endDate");

                // 检查 startDate 和 endDate 是否有效
                if (!startDate || !endDate || typeof startDate !== 'string' || typeof endDate !== 'string') {
                    return null; // 如果无效，返回 null 或其他错误处理逻辑
                }

                // 处理特殊时间格式
                if (startDate.includes('0000-00-00') || endDate.includes("0000-00-00")) {
                    return this.formatPercents(online, this.toFixed2(100));
                }

                // 检查 startDate 和 endDate 是否为合法的Date
                if (isNaN(new Date(startDate).getTime()) || isNaN(new Date(endDate).getTime())) {
                    return {
                        "class": "",
                        "style": "width: 0%",
                        "percent": "0"
                    }
                }

                //处理特殊时间格式
                const percent = this.getRemainingPercent(startDate, endDate, note);
                return this.formatPercents(online, this.toFixed2(percent));                    
                
            },
            getRemainingDays(endDate, note, type) {
                // 检查 endDate 是否有效
                if (!endDate || typeof endDate !== 'string') {
                    return null;
                }

                // 处理特殊时间格式
                if (endDate.includes("0000-00-00")) {
                    return "lifetime";
                }

                // 检查 endDate 是否为合法的Date
                if (isNaN(new Date(endDate).getTime())) {
                    return  type === 1 ? null : "NaN";
                }
                
                // 获取当前时间，并调整时区
                const currentTime = this.getAdjustTimezone(new Date(endDate), new Date());

                // 获取计费周期和自动续订日期
                const billingCycle = this.getNoteElementValue(note, "billingDataMod", "cycle") || "月";
                const autoEndDate = this.getAutoRenewalEndDate(
                    this.getNoteElementValue(note, "billingDataMod", "endDate"),
                    this.getBillingCycle(billingCycle)
                );

                // 检查 autoRenewal 状态
                const autoRenewal = this.getNoteElementValue(note, "billingDataMod", "autoRenewal") == 1;

                // 确定到期时间
                const end = autoRenewal ? autoEndDate.date : new Date(endDate);

                // 直接返回处理后的到期时间
                if (type === 1) return end;

                // 计算剩余天数
                const timeDiff = end - currentTime;
                const daysDiff = Math.ceil(timeDiff / (1000 * 60 * 60 * 24));

                return daysDiff;
            },
            getRemainingPercent(startDate, endDate, note) {
                // 检查 startDate 和 endDate 是否为有效字符串并处理特殊格式
                if (!startDate || !endDate || typeof startDate !== 'string' || typeof endDate !== 'string') {
                    return null;
                }

                // 处理特殊时间格式
                if (startDate.includes("0000-00-00") || endDate.includes("0000-00-00")) {
                    return 100;
                }

                // 检查 startDate 和 endDate 是否为合法的Date
                if (isNaN(new Date(startDate).getTime()) || isNaN(new Date(endDate).getTime())) {
                    return "NaN";
                }
                
                // 获取当前时间并调整时区
                const now = this.getAdjustTimezone(new Date(endDate), new Date());

                // 获取计费周期
                const billingCycle = this.getNoteElementValue(note, "billingDataMod", "cycle") || "月";

                // 自动获取结束日期
                const autoEndDate = this.getAutoRenewalEndDate(
                    this.getNoteElementValue(note, "billingDataMod", "endDate"),
                    this.getBillingCycle(billingCycle)
                );

                // 自动获取开始日期
                const autoStartDate = autoEndDate.flag == 1
                    ? this.getAutoRenewalStartDate(autoEndDate.flag, this.getNoteElementValue(note, "billingDataMod", "startDate"), autoEndDate.check, autoEndDate.count)
                    : new Date(startDate);
                
                // 计算开始和结束时间
                const autoRenewal = this.getNoteElementValue(note, "billingDataMod", "autoRenewal") == 1;
                const start = autoRenewal ? autoStartDate : new Date(startDate);
                const end = autoRenewal ? autoEndDate.date : new Date(endDate);

                // 计算剩余百分比
                if (now < start) {
                    return 0.01; //避免当条件判断!percent被过滤
                }
                if (now >= end) {
                    return 100;
                }

                const totalDuration = end - start;
                const elapsedDuration = now - start;
                const percent = (elapsedDuration / totalDuration) * 100;

                // 确保百分比在 0-100 之间
                return Math.min(Math.max(percent, 0), 100);
            }
        }
    })
});
